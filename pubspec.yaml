name: metrotype
description: "A modern keyboard inspired by Windows Phone."

publish_to: "none"
homepage: https://softyes.com.br
repository: https://github.com/MTRX8/metrotype
issue_tracker: https://github.com/MTRX8/metrotype/issues

version: 0.1.0+1

environment:
  sdk: ^3.13.3
  flutter: ^3.47.4

dependencies:
  flutter:
    sdk: flutter

  modern_ui: ^0.1.0
  native_haptics_and_audio: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^11.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
